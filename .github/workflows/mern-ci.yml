name: MERN React application CI

on:
  push:
    branches: [MERN]
    paths:
      - "mern/**"
      - ".github/workflows/mern-ci.yml"
  pull_request:
    branches: [MERN]
    paths:
      - "mern/**"
      - ".github/workflows/mern-ci.yml"

permissions:
  contents: read

concurrency:
  group: mern-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mern
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Run unit tests
        run: npm test
      - name: Lint application
        run: npm run lint
      - name: Build Next.js application
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser regression tests
        run: npm run test:e2e
      - name: Upload test evidence and generated lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mern-ci-evidence
          path: |
            mern/test-results/
            mern/playwright-report/
            mern/package-lock.json
          if-no-files-found: ignore
