name: MERN workspace CI

on:
  push:
    branches: [MERN]
    paths:
      - "mern/**"
      - ".github/workflows/mern-ci.yml"
  pull_request:
    branches: [MERN]
    paths:
      - "mern/**"
      - ".github/workflows/mern-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mern
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run unit tests
        run: npm test
      - name: Build React application
        run: npm run build
