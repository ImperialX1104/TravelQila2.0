name: MERN React application CI

on:
  push:
    branches: [MERN]
    paths:
      - "mern/**"
      - ".github/workflows/mern-ci.yml"
  pull_request:
    branches: [MERN]
    paths:
      - "mern/**"
      - ".github/workflows/mern-ci.yml"

permissions:
  contents: read

concurrency:
  group: mern-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mern
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mern/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Run unit tests
        run: npm test
      - name: Lint application
        run: npm run lint
      - name: Build Next.js application
        run: npm run build
